<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tests Portfolio — Engine</title>
<style>
  body { font-family: monospace; background: #0c1225; color: #f0f4ff; padding: 20px; }
  .pass { color: #34d399; } .fail { color: #f87171; }
  .summary { margin-top: 20px; font-size: 16px; font-weight: bold; border-top: 1px solid #333; padding-top: 12px; }
  .test-name { color: #7b8ab8; }
</style>
</head>
<body>
<h1>Tests — PF.Engine</h1>
<div id="results"></div>
<div class="summary" id="summary"></div>

<script src="../js/utils.js"></script>
<script src="../js/state.js"></script>
<script src="../js/engine.js"></script>
<script>
const R = document.getElementById('results');
const results = { pass: 0, fail: 0, errors: [] };

function assert(condition, name) {
  if (condition) {
    results.pass++;
    R.innerHTML += `<div><span class="pass">✓</span> <span class="test-name">${name}</span></div>`;
  } else {
    results.fail++;
    R.innerHTML += `<div><span class="fail">✗</span> <span class="test-name">${name}</span></div>`;
    results.errors.push(name);
  }
}

function approx(a, b, name, eps) {
  eps = eps || 0.01;
  assert(Math.abs(a - b) < eps, name + ` (${a} ≈ ${b})`);
}

// ── _txHash ──
(function testTxHash() {
  assert(PF.Engine._txHash([]) === 0, '_txHash empty = 0');
  const h1 = PF.Engine._txHash([{ date: '2024-01-01', symbol: 'BTC', type: 'buy', amount: 1, price: 50000, fees: 0 }]);
  const h2 = PF.Engine._txHash([{ date: '2024-01-01', symbol: 'BTC', type: 'buy', amount: 1, price: 50000, fees: 0 }]);
  assert(h1 === h2, '_txHash same input = same hash');
  const h3 = PF.Engine._txHash([{ date: '2024-01-01', symbol: 'BTC', type: 'buy', amount: 2, price: 50000, fees: 0 }]);
  assert(h1 !== h3, '_txHash different amount = different hash');
})();

// ── computePositions ──
(function testComputePositions() {
  const pm = { bitcoin: { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', price: 60000, change24h: 2 } };

  // Simple buy
  const txs = [{ date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 50000, amount: 1, fees: 0 }];
  const pos = PF.Engine.computePositions(txs, {}, pm, 1);
  assert(pos.length === 1, 'computePositions: 1 buy → 1 position');
  assert(pos[0].symbol === 'BTC', 'computePositions: symbol = BTC');
  approx(pos[0].qty, 1, 'computePositions: qty = 1');
  approx(pos[0].avgBuyPriceUSD, 50000, 'computePositions: avgBuyPrice = 50000');

  // Buy + sell (partial)
  const txs2 = [
    { date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 50000, amount: 2, fees: 0 },
    { date: '2024-02-01', symbol: 'BTC', type: 'sell', price: 60000, amount: 1, fees: 0 }
  ];
  const pos2 = PF.Engine.computePositions(txs2, {}, pm, 1);
  assert(pos2.length === 1, 'buy+sell: still 1 position');
  approx(pos2[0].qty, 1, 'buy+sell: qty = 1');

  // Buy + sell all → no position
  const txs3 = [
    { date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 50000, amount: 1, fees: 0 },
    { date: '2024-02-01', symbol: 'BTC', type: 'sell', price: 60000, amount: 1, fees: 0 }
  ];
  const pos3 = PF.Engine.computePositions(txs3, {}, pm, 1);
  assert(pos3.length === 0, 'buy+sell all: no position');

  // Fees in buy cost
  const txs4 = [{ date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 50000, amount: 1, fees: 100 }];
  const pos4 = PF.Engine.computePositions(txs4, {}, pm, 1);
  approx(pos4[0].avgBuyPriceUSD, 50100, 'fees in buy: avgBuy = 50100');

  // Manual coins
  const manual = { MTK: { name: 'Mon Token', priceUSD: 10 } };
  const txs5 = [{ date: '2024-01-01', symbol: 'MTK', type: 'buy', price: 5, amount: 100, fees: 0 }];
  const pos5 = PF.Engine.computePositions(txs5, manual, {}, 1);
  assert(pos5.length === 1, 'manual coin: position created');
  assert(pos5[0].manual === true, 'manual coin: manual=true');
  approx(pos5[0].manualPriceUSD, 10, 'manual coin: manualPriceUSD=10');

  // Multiple symbols
  const txs6 = [
    { date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 50000, amount: 1, fees: 0 },
    { date: '2024-01-01', symbol: 'ETH', type: 'buy', price: 3000, amount: 10, fees: 0 }
  ];
  const pos6 = PF.Engine.computePositions(txs6, {}, { bitcoin: { price: 60000 }, ethereum: { price: 3500 } }, 1);
  assert(pos6.length === 2, 'multiple symbols: 2 positions');
})();

// ── computePositionPL ──
(function testComputePositionPL() {
  const pm = { bitcoin: { price: 60000 } };
  const agg = { BTC: { buyQty: 1, buyCost: 50000, sellQty: 0, sellProceeds: 0, totalFees: 0 } };
  const pos = { symbol: 'BTC', qty: 1, avgBuyPriceUSD: 50000, manual: false };
  const pl = PF.Engine.computePositionPL(pos, pm, 1, agg);
  approx(pl.curPrice, 60000, 'P&L: curPrice');
  approx(pl.buyPrice, 50000, 'P&L: buyPrice');
  approx(pl.invested, 50000, 'P&L: invested');
  approx(pl.currentValue, 60000, 'P&L: currentValue');
  approx(pl.realized, 0, 'P&L: realized (no sell)');
  approx(pl.pl, 10000, 'P&L: pl = 10000');
  approx(pl.ret, 20, 'P&L: ret = 20%');

  // With realized P&L
  const agg2 = { BTC: { buyQty: 2, buyCost: 100000, sellQty: 1, sellProceeds: 60000, totalFees: 0 } };
  const pos2 = { symbol: 'BTC', qty: 1, avgBuyPriceUSD: 50000, manual: false };
  const pl2 = PF.Engine.computePositionPL(pos2, pm, 1, agg2);
  approx(pl2.realized, 10000, 'P&L with sell: realized = 10000');
  approx(pl2.pl, 20000, 'P&L with sell: pl = 20000');
})();

// ── computeSummary ──
(function testComputeSummary() {
  const pm = { bitcoin: { price: 60000 }, ethereum: { price: 3000 } };
  const positions = [
    { symbol: 'BTC', qty: 1, avgBuyPriceUSD: 50000, coinId: 'bitcoin', manual: false },
    { symbol: 'ETH', qty: 10, avgBuyPriceUSD: 2000, coinId: 'ethereum', manual: false }
  ];
  const agg = {
    BTC: { buyQty: 1, buyCost: 50000, sellQty: 0, sellProceeds: 0, totalFees: 0 },
    ETH: { buyQty: 10, buyCost: 20000, sellQty: 0, sellProceeds: 0, totalFees: 0 }
  };
  const s = PF.Engine.computeSummary(positions, pm, 1, agg);
  approx(s.invested, 70000, 'summary: invested');
  approx(s.value, 90000, 'summary: value');
  approx(s.pl, 20000, 'summary: pl');
  approx(s.ret, 28.57, 'summary: ret', 0.1);
})();

// ── computeChartData ──
(function testComputeChartData() {
  const pm = { bitcoin: { id: 'bitcoin', symbol: 'BTC', price: 60000 }, ethereum: { id: 'ethereum', symbol: 'ETH', price: 3000 } };
  const positions = [
    { symbol: 'BTC', qty: 1, avgBuyPriceUSD: 50000, coinId: 'bitcoin', manual: false },
    { symbol: 'ETH', qty: 10, avgBuyPriceUSD: 2000, coinId: 'ethereum', manual: false }
  ];
  const chart = PF.Engine.computeChartData(positions, pm, 1, 'value');
  assert(chart.labels.length === 2, 'chartData: 2 labels');
  assert(chart.data.length === 2, 'chartData: 2 values');
  approx(chart.data[0], 60000, 'chartData: BTC value');
  approx(chart.data[1], 30000, 'chartData: ETH value');
})();

// ── FX Rate ──
(function testFxRate() {
  const pm = { tether: { price: 0.92 } };
  const txs = [{ date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 46000, amount: 1, fees: 0 }];
  const pos = PF.Engine.computePositions(txs, {}, pm, 0.92);
  // avgBuyPriceUSD should be price/fxRate = 46000/0.92 = 50000
  approx(pos[0].avgBuyPriceUSD, 50000, 'FX: avgBuyPrice in USD');
})();

// ── Edge cases ──
(function testEdgeCases() {
  const pos = PF.Engine.computePositions([], {}, {}, 1);
  assert(pos.length === 0, 'edge: empty txs → empty positions');

  const txs = [{ date: '2024-01-01', symbol: '', type: 'buy', price: 100, amount: 1, fees: 0 }];
  const pos2 = PF.Engine.computePositions(txs, {}, {}, 1);
  assert(pos2.length === 0, 'edge: empty symbol → ignored');

  const txs3 = [{ date: '2024-01-01', symbol: 'BTC', type: 'buy', price: 0, amount: 0, fees: 0 }];
  const pos3 = PF.Engine.computePositions(txs3, {}, {}, 1);
  assert(pos3.length === 0, 'edge: zero amount → no position');
})();

// ── getCurPrice manual ──
(function testManualPrice() {
  const pos = { symbol: 'MTK', manual: true, manualPriceUSD: 42 };
  const price = PF.Engine.getCurPrice(pos, {}, 1);
  assert(price === 42, 'getCurPrice manual: returns manualPriceUSD');
  const priceEur = PF.Engine.getCurPrice(pos, {}, 0.92);
  approx(priceEur, 38.64, 'getCurPrice manual EUR', 0.01);
})();

// ── Summary ──
const el = document.getElementById('summary');
if (results.fail === 0) {
  el.innerHTML = `<span class="pass">✓ ${results.pass} tests passés, 0 échec</span>`;
} else {
  el.innerHTML = `<span class="fail">✗ ${results.fail} échec(s) sur ${results.pass + results.fail}</span><br>` +
    results.errors.map(e => `<span class="fail">  → ${e}</span>`).join('<br>');
}
</script>
</body>
</html>
