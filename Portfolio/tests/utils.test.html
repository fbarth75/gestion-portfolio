<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tests Portfolio — Utils</title>
<style>
  body { font-family: monospace; background: #0c1225; color: #f0f4ff; padding: 20px; }
  .pass { color: #34d399; } .fail { color: #f87171; }
  .summary { margin-top: 20px; font-size: 16px; font-weight: bold; border-top: 1px solid #333; padding-top: 12px; }
  .test-name { color: #7b8ab8; }
</style>
</head>
<body>
<h1>Tests — PF.Utils</h1>
<div id="results"></div>
<div class="summary" id="summary"></div>

<script src="../js/utils.js"></script>
<script>
const R = document.getElementById('results');
const results = { pass: 0, fail: 0, errors: [] };

function assert(condition, name) {
  if (condition) {
    results.pass++;
    R.innerHTML += `<div><span class="pass">✓</span> <span class="test-name">${name}</span></div>`;
  } else {
    results.fail++;
    R.innerHTML += `<div><span class="fail">✗</span> <span class="test-name">${name}</span></div>`;
    results.errors.push(name);
  }
}

// ── isValidDate ──
(function() {
  assert(PF.Utils.isValidDate('2024-01-15'), 'date: valid');
  assert(PF.Utils.isValidDate('2024-12-31'), 'date: dec 31');
  assert(!PF.Utils.isValidDate('2024-13-01'), 'date: month 13 invalid');
  assert(!PF.Utils.isValidDate('2024-02-30'), 'date: feb 30 invalid');
  assert(!PF.Utils.isValidDate('2024-02-29'), 'date: feb 29 leap year');
  assert(!PF.Utils.isValidDate('2023-02-29'), 'date: feb 29 non-leap invalid');
  assert(!PF.Utils.isValidDate(''), 'date: empty invalid');
  assert(!PF.Utils.isValidDate(null), 'date: null invalid');
  assert(!PF.Utils.isValidDate('2024/01/15'), 'date: wrong format');
  assert(!PF.Utils.isValidDate('2024-1-15'), 'date: no zero padding');
  assert(PF.Utils.isValidDate('2000-01-01'), 'date: 2000-01-01 valid');
})();

// ── isValidSymbol ──
(function() {
  assert(PF.Utils.isValidSymbol('BTC'), 'symbol: BTC');
  assert(PF.Utils.isValidSymbol('btc'), 'symbol: lowercase ok');
  assert(PF.Utils.isValidSymbol('ETHFI'), 'symbol: ETHFI');
  assert(PF.Utils.isValidSymbol('A'), 'symbol: single char');
  assert(!PF.Utils.isValidSymbol(''), 'symbol: empty');
  assert(!PF.Utils.isValidSymbol(null), 'symbol: null');
  assert(!PF.Utils.isValidSymbol('BITCOIN_TOOO_LONG'), 'symbol: too long');
  assert(!PF.Utils.isValidSymbol('BTC '), 'symbol: trailing space');
  assert(!PF.Utils.isValidSymbol('BTC-USD'), 'symbol: hyphen invalid');
})();

// ── isValidAmount ──
(function() {
  assert(PF.Utils.isValidAmount(1), 'amount: integer');
  assert(PF.Utils.isValidAmount('0.5'), 'amount: decimal string');
  assert(PF.Utils.isValidAmount('1000.123456'), 'amount: many decimals');
  assert(!PF.Utils.isValidAmount(0), 'amount: zero invalid');
  assert(!PF.Utils.isValidAmount(-1), 'amount: negative invalid');
  assert(!PF.Utils.isValidAmount('abc'), 'amount: text invalid');
  assert(!PF.Utils.isValidAmount(''), 'amount: empty invalid');
  assert(!PF.Utils.isValidAmount(NaN), 'amount: NaN invalid');
  assert(!PF.Utils.isValidAmount(Infinity), 'amount: Infinity invalid');
})();

// ── isValidPrice ──
(function() {
  assert(PF.Utils.isValidPrice(0), 'price: zero valid');
  assert(PF.Utils.isValidPrice(50000), 'price: 50000');
  assert(PF.Utils.isValidPrice('0.001'), 'price: small decimal');
  assert(!PF.Utils.isValidPrice(-1), 'price: negative invalid');
  assert(!PF.Utils.isValidPrice('abc'), 'price: text invalid');
})();

// ── isValidFees ──
(function() {
  assert(PF.Utils.isValidFees(''), 'fees: empty valid (optional)');
  assert(PF.Utils.isValidFees(null), 'fees: null valid (optional)');
  assert(PF.Utils.isValidFees(0), 'fees: zero valid');
  assert(PF.Utils.isValidFees(10.5), 'fees: 10.5 valid');
  assert(!PF.Utils.isValidFees(-1), 'fees: negative invalid');
})();

// ── sanitizeString ──
(function() {
  assert(PF.Utils.sanitizeString('hello', 10) === 'hello', 'sanitize: normal');
  assert(PF.Utils.sanitizeString('  hello  ', 10) === 'hello', 'sanitize: trimmed');
  assert(PF.Utils.sanitizeString('abcdefghij', 5) === 'abcde', 'sanitize: truncated');
  assert(PF.Utils.sanitizeString('', 10) === '', 'sanitize: empty');
  assert(PF.Utils.sanitizeString(null, 10) === '', 'sanitize: null');
})();

// ── sanitizeTags ──
(function() {
  const t1 = PF.Utils.sanitizeTags('dca, long-term, defi');
  assert(t1.length === 3, 'sanitizeTags: 3 tags');
  assert(t1[0] === 'dca', 'sanitizeTags: first = dca');
  const t2 = PF.Utils.sanitizeTags('Clean!@#$%Tag');
  assert(t2[0] === 'cleantag', 'sanitizeTags: special chars removed');
  assert(PF.Utils.sanitizeTags('').length === 0, 'sanitizeTags: empty');
  assert(PF.Utils.sanitizeTags('a,b,c,d,e,f,g,h,i,j,k,l,m,n,o,p,q,r,s,t,u,v').length === 20, 'sanitizeTags: max 20');
})();

// ── escapeHtml ──
(function() {
  assert(PF.Utils.escapeHtml('<script>') === '&lt;script&gt;', 'escapeHtml: script tag');
  assert(PF.Utils.escapeHtml('"a"') === '&quot;a&quot;', 'escapeHtml: quotes');
  assert(PF.Utils.escapeHtml("it's") === 'it&#39;s', 'escapeHtml: apostrophe');
  assert(PF.Utils.escapeHtml('') === '', 'escapeHtml: empty');
  assert(PF.Utils.escapeHtml(null) === '', 'escapeHtml: null');
})();

// ── escapeJS ──
(function() {
  assert(PF.Utils.escapeJS("it's") === "it\\'s", 'escapeJS: apostrophe');
  assert(PF.Utils.escapeJS('<x>') === '\\x3c\\x3e', 'escapeJS: angle brackets');
  assert(PF.Utils.escapeJS('') === '', 'escapeJS: empty');
})();

// ── isSafeUrl ──
(function() {
  assert(PF.Utils.isSafeUrl('https://example.com/img.png'), 'isSafeUrl: https ok');
  assert(PF.Utils.isSafeUrl('data:image/png;base64,abc'), 'isSafeUrl: data image ok');
  assert(!PF.Utils.isSafeUrl('http://example.com/img.png'), 'isSafeUrl: http blocked');
  assert(!PF.Utils.isSafeUrl('javascript:alert(1)'), 'isSafeUrl: javascript blocked');
  assert(!PF.Utils.isSafeUrl(''), 'isSafeUrl: empty');
  assert(!PF.Utils.isSafeUrl(null), 'isSafeUrl: null');
})();

// ── fmt ──
(function() {
  assert(PF.Utils.fmt(1234.5) === '1 234,50', 'fmt: French number');
  assert(PF.Utils.fmt(null) === '—', 'fmt: null → dash');
  assert(PF.Utils.fmt(NaN) === '—', 'fmt: NaN → dash');
})();

// ── Summary ──
const el = document.getElementById('summary');
if (results.fail === 0) {
  el.innerHTML = `<span class="pass">✓ ${results.pass} tests passés, 0 échec</span>`;
} else {
  el.innerHTML = `<span class="fail">✗ ${results.fail} échec(s) sur ${results.pass + results.fail}</span><br>` +
    results.errors.map(e => `<span class="fail">  → ${e}</span>`).join('<br>');
}
</script>
</body>
</html>
